<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="820" fill="#f8fafc" rx="12"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="56" fill="#fff" rx="12"/>
  <rect x="0" y="44" width="900" height="12" fill="#fff"/>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#0f172a">Concept A — Inline Accordion</text>
  <text x="580" y="36" font-size="13" fill="#64748b">Click any budget row to expand transactions below it</text>

  <!-- === COLLAPSED ROW: Groceries === -->
  <rect x="32" y="76" width="540" height="100" rx="8" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <!-- Header -->
  <text x="52" y="100" font-size="14" font-weight="600" fill="#1e293b">Food &amp; Dining: Groceries</text>
  <text x="524" y="100" font-size="12" font-weight="500" fill="#1e293b" text-anchor="end">$980.00</text>
  <!-- Slider track -->
  <rect x="52" y="114" width="500" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="52" y="114" width="245" height="6" rx="3" fill="#0ea5e9"/>
  <!-- 3-mo avg marker -->
  <rect x="293" y="112" width="2" height="10" rx="1" fill="#94a3b8"/>
  <!-- Labels -->
  <text x="52" y="140" font-size="10" fill="#94a3b8">$0</text>
  <text x="290" y="140" font-size="10" fill="#94a3b8" text-anchor="middle">3-mo avg: $978.06</text>
  <text x="552" y="140" font-size="10" fill="#94a3b8" text-anchor="end">$1,960.00</text>
  <!-- Expand hint -->
  <polygon points="280,155 290,165 300,155" fill="#cbd5e1"/>
  <text x="310" y="163" font-size="10" fill="#94a3b8">tap to see transactions</text>

  <!-- === EXPANDED ROW: Mortgage (active) === -->
  <rect x="32" y="190" width="540" height="370" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Header -->
  <text x="52" y="218" font-size="14" font-weight="600" fill="#1e293b">Home: Mortgage</text>
  <circle cx="170" cy="213" r="4" fill="#0ea5e9"/>
  <text x="524" y="218" font-size="12" font-weight="500" fill="#0ea5e9" text-anchor="end">$2,200.00</text>
  <!-- Slider track -->
  <rect x="52" y="232" width="500" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="52" y="232" width="280" height="6" rx="3" fill="#0ea5e9"/>
  <!-- 3-mo avg marker -->
  <rect x="278" y="230" width="2" height="10" rx="1" fill="#94a3b8"/>
  <!-- Labels -->
  <text x="52" y="258" font-size="10" fill="#94a3b8">$0</text>
  <text x="275" y="258" font-size="10" fill="#94a3b8" text-anchor="middle">3-mo avg: $2,200.00</text>
  <text x="552" y="258" font-size="10" fill="#94a3b8" text-anchor="end">$4,400.00</text>

  <!-- Divider -->
  <line x1="52" y1="272" x2="552" y2="272" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Transaction list header -->
  <text x="52" y="292" font-size="11" font-weight="600" fill="#475569">Recent Transactions (3 months)</text>
  <text x="552" y="292" font-size="11" font-weight="500" fill="#475569" text-anchor="end">6 transactions</text>

  <!-- Month group: Aug -->
  <rect x="52" y="302" width="500" height="22" rx="4" fill="#f1f5f9"/>
  <text x="62" y="317" font-size="10" font-weight="600" fill="#64748b">August 2026</text>
  <text x="542" y="317" font-size="10" font-weight="600" fill="#64748b" text-anchor="end">$2,200.00</text>

  <!-- Transaction rows -->
  <text x="62" y="340" font-size="11" fill="#334155">Wells Fargo Mortgage</text>
  <text x="542" y="340" font-size="11" fill="#334155" text-anchor="end">$2,200.00</text>
  <text x="62" y="354" font-size="9" fill="#94a3b8">Aug 1, 2026</text>

  <!-- Month group: Jul -->
  <rect x="52" y="368" width="500" height="22" rx="4" fill="#f1f5f9"/>
  <text x="62" y="383" font-size="10" font-weight="600" fill="#64748b">July 2026</text>
  <text x="542" y="383" font-size="10" font-weight="600" fill="#64748b" text-anchor="end">$2,200.00</text>

  <text x="62" y="406" font-size="11" fill="#334155">Wells Fargo Mortgage</text>
  <text x="542" y="406" font-size="11" fill="#334155" text-anchor="end">$2,200.00</text>
  <text x="62" y="420" font-size="9" fill="#94a3b8">Jul 1, 2026</text>

  <!-- Month group: Jun -->
  <rect x="52" y="434" width="500" height="22" rx="4" fill="#f1f5f9"/>
  <text x="62" y="449" font-size="10" font-weight="600" fill="#64748b">June 2026</text>
  <text x="542" y="449" font-size="10" font-weight="600" fill="#64748b" text-anchor="end">$2,200.00</text>

  <text x="62" y="472" font-size="11" fill="#334155">Wells Fargo Mortgage</text>
  <text x="542" y="472" font-size="11" fill="#334155" text-anchor="end">$2,200.00</text>
  <text x="62" y="486" font-size="9" fill="#94a3b8">Jun 1, 2026</text>

  <!-- Monthly avg summary -->
  <rect x="52" y="500" width="500" height="30" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="62" y="520" font-size="11" font-weight="500" fill="#0369a1">Monthly avg: $2,200.00</text>
  <text x="542" y="520" font-size="11" fill="#0369a1" text-anchor="end">Variance: $0.00 — consistent</text>

  <!-- Collapse hint -->
  <polygon points="280,545 290,535 300,545" fill="#0ea5e9"/>

  <!-- === COLLAPSED ROW: Gas === -->
  <rect x="32" y="574" width="540" height="100" rx="8" fill="#fff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="52" y="598" font-size="14" font-weight="600" fill="#1e293b">Auto: Gas &amp; Fuel</text>
  <text x="524" y="598" font-size="12" font-weight="500" fill="#1e293b" text-anchor="end">$170.00</text>
  <rect x="52" y="612" width="500" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="52" y="612" width="170" height="6" rx="3" fill="#0ea5e9"/>
  <rect x="163" y="610" width="2" height="10" rx="1" fill="#94a3b8"/>
  <text x="52" y="638" font-size="10" fill="#94a3b8">$0</text>
  <text x="160" y="638" font-size="10" fill="#94a3b8" text-anchor="middle">3-mo avg: $165.10</text>
  <text x="552" y="638" font-size="10" fill="#94a3b8" text-anchor="end">$500.00</text>
  <polygon points="280,653 290,663 300,653" fill="#cbd5e1"/>
  <text x="310" y="661" font-size="10" fill="#94a3b8">tap to see transactions</text>

  <!-- Suggestions panel (right sidebar) -->
  <rect x="596" y="76" width="272" height="260" rx="8" fill="#fffbeb" stroke="#fde68a" filter="url(#shadow)"/>
  <text x="616" y="102" font-size="13" font-weight="600" fill="#92400e">Suggested budgets</text>
  <text x="616" y="118" font-size="10" fill="#a16207">Based on 3-month spending:</text>

  <rect x="616" y="130" width="232" height="36" rx="6" fill="#fff" stroke="#fde68a"/>
  <text x="626" y="148" font-size="11" font-weight="500" fill="#1e293b">Shopping</text>
  <text x="626" y="161" font-size="9" fill="#94a3b8">avg $1,234.64/mo</text>
  <text x="838" y="152" font-size="11" font-weight="600" fill="#0ea5e9" text-anchor="end">+ $1,235.00</text>

  <rect x="616" y="174" width="232" height="36" rx="6" fill="#fff" stroke="#fde68a"/>
  <text x="626" y="192" font-size="11" font-weight="500" fill="#1e293b">Cash &amp; ATM</text>
  <text x="626" y="205" font-size="9" fill="#94a3b8">avg $1,002.83/mo</text>
  <text x="838" y="196" font-size="11" font-weight="600" fill="#0ea5e9" text-anchor="end">+ $1,005.00</text>

  <rect x="616" y="218" width="232" height="36" rx="6" fill="#fff" stroke="#fde68a"/>
  <text x="626" y="236" font-size="11" font-weight="500" fill="#1e293b">Life Insurance</text>
  <text x="626" y="249" font-size="9" fill="#94a3b8">avg $901.26/mo</text>
  <text x="838" y="240" font-size="11" font-weight="600" fill="#0ea5e9" text-anchor="end">+ $905.00</text>

  <!-- Annotation box -->
  <rect x="32" y="700" width="836" height="100" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="52" y="726" font-size="14" font-weight="700" fill="#0f172a">How it works</text>
  <text x="52" y="748" font-size="12" fill="#475569">Each budget card is tappable. Expanding it reveals the last 3 months of transactions for that category,</text>
  <text x="52" y="766" font-size="12" fill="#475569">grouped by month with subtotals and a variance indicator. The slider and 3-mo avg stay visible above</text>
  <text x="52" y="784" font-size="12" fill="#475569">so the user adjusts the budget with full context. Only one row expands at a time to keep the page scannable.</text>
</svg>
