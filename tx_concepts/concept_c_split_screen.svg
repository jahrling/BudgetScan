<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="880" fill="#f8fafc" rx="12"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="56" fill="#fff" rx="12"/>
  <rect x="0" y="44" width="900" height="12" fill="#fff"/>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="36" font-size="20" font-weight="700" fill="#0f172a">Concept C — Sticky Context Bar + Scrolling Transactions</text>

  <!-- === TOP HALF: Budget card pinned at top === -->
  <rect x="32" y="72" width="836" height="220" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Sticky indicator -->
  <rect x="32" y="72" width="836" height="36" rx="10" fill="#f0f9ff"/>
  <rect x="32" y="100" width="836" height="8" fill="#f0f9ff"/>
  <text x="52" y="95" font-size="13" font-weight="700" fill="#0369a1">PLANNING: Food &amp; Dining: Groceries</text>
  <!-- Close / back -->
  <circle cx="844" cy="90" r="12" fill="#e0f2fe" stroke="#bae6fd"/>
  <text x="844" y="95" font-size="14" font-weight="600" fill="#0369a1" text-anchor="middle">×</text>
  <!-- Breadcrumb -->
  <text x="730" y="95" font-size="10" fill="#64748b" text-anchor="end">‹ back to all budgets</text>

  <!-- Budget amount and slider — full width -->
  <text x="52" y="134" font-size="24" font-weight="700" fill="#0f172a">$980.00</text>
  <text x="190" y="134" font-size="13" fill="#64748b">/ month</text>

  <!-- Action buttons -->
  <rect x="700" y="116" width="60" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="730" y="134" font-size="11" fill="#475569" text-anchor="middle">Edit</text>
  <rect x="770" y="116" width="80" height="28" rx="6" fill="#fef3c7" stroke="#fde68a"/>
  <text x="810" y="134" font-size="11" fill="#92400e" text-anchor="middle">Use avg</text>

  <!-- Full-width slider -->
  <rect x="52" y="154" width="796" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="52" y="154" width="398" height="8" rx="4" fill="#0ea5e9"/>
  <!-- Avg marker -->
  <rect x="446" y="150" width="3" height="16" rx="1.5" fill="#f59e0b"/>
  <!-- Slider thumb -->
  <circle cx="450" cy="158" r="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>

  <text x="52" y="182" font-size="10" fill="#94a3b8">$0</text>
  <text x="448" y="182" font-size="10" fill="#f59e0b" text-anchor="middle">3-mo avg: $978.06</text>
  <text x="848" y="182" font-size="10" fill="#94a3b8" text-anchor="end">$1,960.00</text>

  <!-- Stats chips -->
  <rect x="52" y="198" width="120" height="32" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="62" y="211" font-size="9" font-weight="600" fill="#15803d">vs AVG</text>
  <text x="62" y="225" font-size="12" font-weight="700" fill="#16a34a">+$1.94 above</text>

  <rect x="184" y="198" width="120" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="194" y="211" font-size="9" font-weight="600" fill="#64748b">TXNS/MO</text>
  <text x="194" y="225" font-size="12" font-weight="700" fill="#1e293b">~5.3</text>

  <rect x="316" y="198" width="140" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="326" y="211" font-size="9" font-weight="600" fill="#64748b">RANGE</text>
  <text x="326" y="225" font-size="12" font-weight="700" fill="#1e293b">$934 – $1,042</text>

  <!-- Mini sparkline -->
  <rect x="470" y="198" width="120" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="211" font-size="9" font-weight="600" fill="#64748b">TREND</text>
  <polyline points="485,226 505,222 525,228 545,220 565,224 580,218" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
  <line x1="485" y1="222" x2="580" y2="222" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- === BOTTOM HALF: Scrolling transactions === -->
  <rect x="32" y="308" width="836" height="36" rx="0" fill="#f8fafc"/>
  <text x="52" y="332" font-size="13" font-weight="700" fill="#475569">Transactions — Last 3 Months</text>
  <text x="848" y="332" font-size="11" fill="#94a3b8" text-anchor="end">16 transactions · scroll ↓</text>

  <!-- Month: August 2026 -->
  <rect x="32" y="352" width="836" height="26" rx="4" fill="#e0f2fe"/>
  <text x="52" y="370" font-size="12" font-weight="700" fill="#0369a1">August 2026</text>
  <text x="848" y="370" font-size="12" font-weight="700" fill="#0369a1" text-anchor="end">$1,042.17 spent</text>

  <!-- Transaction rows -->
  <rect x="32" y="382" width="836" height="52" rx="0" fill="#fff" stroke="#f1f5f9" stroke-width="0 0 1 0"/>
  <line x1="32" y1="434" x2="868" y2="434" stroke="#f1f5f9"/>
  <text x="52" y="404" font-size="13" font-weight="500" fill="#1e293b">Kroger</text>
  <text x="52" y="422" font-size="10" fill="#94a3b8">Aug 22, 2026 · Debit card ending 4821</text>
  <text x="848" y="410" font-size="14" font-weight="600" fill="#1e293b" text-anchor="end">$187.43</text>

  <rect x="32" y="436" width="836" height="52" rx="0" fill="#fff"/>
  <line x1="32" y1="488" x2="868" y2="488" stroke="#f1f5f9"/>
  <text x="52" y="458" font-size="13" font-weight="500" fill="#1e293b">Costco Wholesale</text>
  <text x="52" y="476" font-size="10" fill="#94a3b8">Aug 15, 2026 · Debit card ending 4821</text>
  <text x="848" y="464" font-size="14" font-weight="600" fill="#1e293b" text-anchor="end">$312.56</text>

  <rect x="32" y="490" width="836" height="52" rx="0" fill="#fff"/>
  <line x1="32" y1="542" x2="868" y2="542" stroke="#f1f5f9"/>
  <text x="52" y="512" font-size="13" font-weight="500" fill="#1e293b">Trader Joe's</text>
  <text x="52" y="530" font-size="10" fill="#94a3b8">Aug 8, 2026 · Debit card ending 4821</text>
  <text x="848" y="518" font-size="14" font-weight="600" fill="#1e293b" text-anchor="end">$94.22</text>

  <rect x="32" y="544" width="836" height="52" rx="0" fill="#fff"/>
  <line x1="32" y1="596" x2="868" y2="596" stroke="#f1f5f9"/>
  <text x="52" y="566" font-size="13" font-weight="500" fill="#1e293b">Kroger</text>
  <text x="52" y="584" font-size="10" fill="#94a3b8">Aug 3, 2026 · Debit card ending 4821</text>
  <text x="848" y="572" font-size="14" font-weight="600" fill="#1e293b" text-anchor="end">$203.81</text>

  <rect x="32" y="598" width="836" height="52" rx="0" fill="#fff"/>
  <line x1="32" y1="650" x2="868" y2="650" stroke="#f1f5f9"/>
  <text x="52" y="620" font-size="13" font-weight="500" fill="#1e293b">Walmart Grocery</text>
  <text x="52" y="638" font-size="10" fill="#94a3b8">Aug 1, 2026 · Debit card ending 7103</text>
  <text x="848" y="626" font-size="14" font-weight="600" fill="#1e293b" text-anchor="end">$244.15</text>

  <!-- Month: July 2026 -->
  <rect x="32" y="654" width="836" height="26" rx="4" fill="#e0f2fe"/>
  <text x="52" y="672" font-size="12" font-weight="700" fill="#0369a1">July 2026</text>
  <text x="848" y="672" font-size="12" font-weight="700" fill="#0369a1" text-anchor="end">$934.18 spent</text>

  <rect x="32" y="684" width="836" height="52" rx="0" fill="#fff"/>
  <line x1="32" y1="736" x2="868" y2="736" stroke="#f1f5f9"/>
  <text x="52" y="706" font-size="13" font-weight="500" fill="#1e293b">Kroger</text>
  <text x="52" y="724" font-size="10" fill="#94a3b8">Jul 25, 2026 · Debit card ending 4821</text>
  <text x="848" y="712" font-size="14" font-weight="600" fill="#1e293b" text-anchor="end">$156.90</text>

  <!-- Scroll fade -->
  <rect x="32" y="738" width="836" height="40" fill="url(#fade)" rx="0"/>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f8fafc" stop-opacity="0"/>
    <stop offset="100%" stop-color="#f8fafc" stop-opacity="1"/>
  </linearGradient>
  <text x="450" y="762" font-size="11" fill="#94a3b8" text-anchor="middle">↓ scroll for June + more</text>

  <!-- Annotation box -->
  <rect x="32" y="786" width="836" height="78" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="52" y="812" font-size="14" font-weight="700" fill="#0f172a">How it works</text>
  <text x="52" y="832" font-size="12" fill="#475569">Clicking a budget row opens a full-width detail view: the budget card with slider and stats pins to the top,</text>
  <text x="52" y="850" font-size="12" fill="#475569">while the transaction list scrolls below. The user adjusts the slider with full transaction context visible.</text>
</svg>
