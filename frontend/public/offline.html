<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>Offline · Finance</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f9fafb;
        color: #111827;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 24rem;
        text-align: center;
      }
      .badge {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
        background: #0ea5e9;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1.75rem;
        font-weight: 700;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { color: #6b7280; margin: 0 0 1.25rem; line-height: 1.4; }
      button {
        background: #0ea5e9;
        color: #fff;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.6rem 1.1rem;
        font-size: 0.95rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">$</div>
      <h1>You’re offline</h1>
      <p>Connect to your home network to refresh budgets and transactions. Cached values may still appear if you re-open the app.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
